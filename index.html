<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Website</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f4f4f4;
      text-align: center;
    }

    header {
      background: #222;
      color: white;
      padding: 15px;
    }

    button {
      padding: 10px 15px;
      margin: 8px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .app {
      display: none;
      background: white;
      width: 340px;
      margin: 20px auto;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input, textarea {
      padding: 8px;
      width: 80%;
      margin-top: 8px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #eee;
      margin-top: 8px;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      border-radius: 5px;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

    .note {
      background: #fff8c4;
      padding: 8px;
      margin-top: 8px;
      border-radius: 5px;
      text-align: left;
    }
  </style>
</head>

<body>

<header>
  <h1>My Website</h1>
</header>

<!-- BUTTONS -->
<button onclick="toggleCalc()">Calculator</button>
<button onclick="toggleTodo()">To-Do</button>
<button onclick="toggleNotes()">Notes</button>

<!-- CALCULATOR -->
<div id="calc" class="app">
  <h3>Calculator</h3>
  <p>Calculator yaha add kiya ja sakta hai</p>
</div>

<!-- TO DO -->
<div id="todo" class="app">
  <h3>To-Do App</h3>

  <input id="taskInput" type="text" placeholder="Enter task">
  <button onclick="addTask()">Add</button>

  <ul id="taskList"></ul>
</div>

<!-- NOTES APP -->
<div id="notes" class="app">
  <h3>Notes App</h3>

  <textarea id="noteInput" placeholder="Write your note..."></textarea><br>
  <button onclick="addNote()">Save Note</button>

  <div id="noteList"></div>
</div>

<script>
  function toggleCalc() {
    toggle("calc");
  }

  function toggleTodo() {
    toggle("todo");
  }

  function toggleNotes() {
    toggle("notes");
  }

  function toggle(id) {
    let app = document.getElementById(id);
    app.style.display = (app.style.display === "block") ? "none" : "block";
  }

  // TO-DO
  function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") return;

    let li = document.createElement("li");
    li.innerHTML = task +
      ' <button class="delete" onclick="this.parentElement.remove()">X</button>';

    document.getElementById("taskList").appendChild(li);
    input.value = "";
  }

  // NOTES
  function addNote() {
    let input = document.getElementById("noteInput");
    let note = input.value.trim();

    if (note === "") return;

    let div = document.createElement("div");
    div.className = "note";
    div.innerHTML = note +
      '<br><button class="delete" onclick="this.parentElement.remove()">Delete</button>';

    document.getElementById("noteList").appendChild(div);

    input.value = "";
  }
</script>

</body>
</html>
