<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Website</title>

<style>
  body {
    font-family: Arial;
    margin: 0;
    text-align: center;
    background: #f4f4f4;
  }

  header {
    background: #222;
    color: white;
    padding: 15px;
  }

  button {
    padding: 10px 15px;
    margin: 8px;
    border: none;
    background: #007bff;
    color: white;
    border-radius: 6px;
    cursor: pointer;
  }

  .app {
    display: none;
    background: white;
    width: 320px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
  }

  input, textarea {
    width: 80%;
    padding: 8px;
    margin-top: 8px;
  }

  ul {
    list-style: none;
    padding: 0;
  }

  li {
    background: #eee;
    margin-top: 8px;
    padding: 8px;
  }

  .delete {
    background: red;
    color: white;
    border: none;
    cursor: pointer;
  }
</style>

</head>

<body>

<header>
  <h1>My Website</h1>
</header>

<!-- BUTTONS -->
<button onclick="showApp('calc')">Calculator</button>
<button onclick="showApp('todo')">To-Do App</button>
<button onclick="showApp('notes')">Notes App</button>

<!-- CALCULATOR -->
<div id="calc" class="app">
  <h3>Calculator</h3>
  <p>Calculator yaha add hoga</p>
</div>

<!-- TO-DO -->
<div id="todo" class="app">
  <h3>To-Do App</h3>

  <input id="taskInput" placeholder="Enter task">
  <button onclick="addTask()">Add</button>

  <ul id="taskList"></ul>
</div>

<!-- NOTES -->
<div id="notes" class="app">
  <h3>Notes App</h3>

  <textarea id="noteInput" placeholder="Write note"></textarea><br>
  <button onclick="addNote()">Save</button>

  <ul id="noteList"></ul>
</div>

<script>

function showApp(id) {
  // sab band
  document.getElementById("calc").style.display = "none";
  document.getElementById("todo").style.display = "none";
  document.getElementById("notes").style.display = "none";

  // selected open
  document.getElementById(id).style.display = "block";
}

/* TO-DO */
function addTask() {
  let input = document.getElementById("taskInput");
  let task = input.value.trim();
  if (task === "") return;

  let li = document.createElement("li");
  li.innerHTML = task + ' <button class="delete" onclick="this.parentElement.remove()">X</button>';

  document.getElementById("taskList").appendChild(li);
  input.value = "";
}

/* NOTES */
function addNote() {
  let input = document.getElementById("noteInput");
  let note = input.value.trim();
  if (note === "") return;

  let li = document.createElement("li");
  li.innerHTML = note + ' <button class="delete" onclick="this.parentElement.remove()">X</button>';

  document.getElementById("noteList").appendChild(li);
  input.value = "";
}

</script>

</body>
</html>
