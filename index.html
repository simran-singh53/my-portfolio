<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: white;
      padding: 15px;
      text-align: center;
    }

    .container {
      padding: 20px;
      text-align: center;
    }

    button {
      padding: 10px 15px;
      margin: 10px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    #todoApp {
      display: none;
      background: white;
      padding: 20px;
      margin-top: 20px;
      border-radius: 10px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    input {
      padding: 8px;
      width: 80%;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #eee;
      margin-top: 8px;
      padding: 8px;
      display: flex;
      justify-content: space-between;
      border-radius: 5px;
    }

    .delete {
      background: red;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 3px;
      padding: 3px 6px;
    }
  </style>
</head>

<body>

<header>
  <h1>My Portfolio Website</h1>
</header>

<div class="container">

  <h2>Welcome!</h2>
  <p>Ye meri simple website hai</p>

  <!-- Button -->
  <button onclick="toggleTodo()">Open To-Do App</button>

  <!-- To Do App -->
  <div id="todoApp">
    <h3>To-Do App</h3>

    <input type="text" id="taskInput" placeholder="New task..." />
    <button onclick="addTask()">Add</button>

    <ul id="taskList"></ul>
  </div>

</div>

<script>
  function toggleTodo() {
    let app = document.getElementById("todoApp");
    app.style.display = (app.style.display === "block") ? "none" : "block";
  }

  function addTask() {
    let input = document.getElementById("taskInput");
    let task = input.value.trim();

    if (task === "") return;

    let li = document.createElement("li");
    li.innerHTML = task + ' <button class="delete" onclick="this.parentElement.remove()">X</button>';

    document.getElementById("taskList").appendChild(li);

    input.value = "";
  }
</script>

</body>
</html>
